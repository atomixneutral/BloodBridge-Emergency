<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BloodBridge Emergency - Find Help Fast</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: { extend: { fontFamily: {
      sans: ['Barlow', 'system-ui', 'sans-serif'],
      display: ['"Barlow Condensed"', 'Impact', 'sans-serif']
    } } }
  };
</script>
<style>
  html, body { height: 100%; margin: 0; padding: 0; }
  .leaflet-container { width: 100%; height: 100%; background: #e2e8f0; font-family: Barlow, system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
  .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: #0f172a; color: #e2e8f0; border: 1px solid #334155; box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.5); }
  .leaflet-popup-content { margin: 12px 16px; }
  .leaflet-container a.leaflet-popup-close-button { color: #94a3b8; padding: 4px; }
  .leaflet-container a.leaflet-popup-close-button:hover { color: #ffffff; }
  .leaflet-marker-icon:focus, .leaflet-interactive:focus, .leaflet-container path:focus { outline: none; }
  .dark-tiles { filter: invert(90%) hue-rotate(190deg) brightness(90%) contrast(95%); }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: #020617; }
  ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: #334155; }
</style>
</head>
<body class="bg-slate-950 text-slate-200 font-sans h-screen overflow-hidden antialiased">
<div class="flex h-full w-full flex-col md:flex-row">

  <!-- LEFT PANEL -->
  <aside class="flex h-[55vh] w-full flex-col border-slate-800 md:h-full md:w-[450px] md:border-r bg-slate-950 z-10 shrink-0 shadow-2xl">
    <header class="shrink-0 border-b border-slate-800 px-5 pb-4 pt-5 bg-slate-900/40 backdrop-blur-md">
      <div class="flex items-center justify-between">
        <h1 class="font-display text-3xl font-bold tracking-wide text-white uppercase">BloodBridge <span class="text-red-500">Emergency</span></h1>
        <span class="inline-flex items-center rounded-md bg-red-500/10 px-2 py-1 text-xs font-medium text-red-400 ring-1 ring-inset ring-red-500/20 animate-pulse">Emergency Help</span>
      </div>

      <div class="mt-3 flex items-center gap-2 bg-slate-900 border border-slate-800 rounded-lg px-3 py-2">
        <div class="relative flex h-2 w-2 shrink-0">
          <div id="status-pulse" class="animate-ping absolute inline-flex h-full w-full rounded-full bg-amber-400 opacity-75"></div>
          <div id="status-dot" class="relative inline-flex rounded-full h-2 w-2 bg-amber-500"></div>
        </div>
        <p id="location-status" class="text-xs font-medium text-slate-400">Finding you...</p>
      </div>

      <div class="relative mt-3">
        <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3">
          <svg class="h-4 w-4 text-slate-500" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" />
          </svg>
        </div>
        <input id="q" type="text" autocomplete="off" placeholder="Type a blood group, e.g. O-, A+, AB"
               class="w-full rounded-lg border border-slate-800 bg-slate-900 py-2.5 pl-9 pr-9 text-sm placeholder-slate-500 focus:border-red-500 focus:outline-none focus:ring-1 focus:ring-red-500 text-white transition-all shadow-inner">
        <button id="clearBtn" title="Clear" class="absolute inset-y-0 right-0 flex items-center pr-3 text-slate-500 hover:text-white transition group hidden">
          <span class="text-xs bg-slate-800 px-1.5 py-0.5 rounded group-hover:bg-slate-700">&#x2715;</span>
        </button>
      </div>
      <p id="q-msg" class="mt-2 hidden text-xs font-medium" aria-live="polite"></p>

      <div class="mt-3">
        <p class="text-[10px] font-bold uppercase tracking-wider text-slate-500 mb-1.5">Need blood? Tap a group</p>
        <div id="chips" class="flex flex-wrap gap-1.5"></div>
      </div>
    </header>

    <section id="list" class="flex-1 space-y-3 overflow-y-auto px-5 py-4 bg-gradient-to-b from-slate-950 to-slate-900" aria-label="Hospitals"></section>

    <!-- Ambulance tracker -->
    <section id="tracker" class="hidden shrink-0 border-t-4 border-red-600 bg-slate-900 px-5 py-4 shadow-[0_-8px_30px_rgb(0,0,0,0.5)] z-20" aria-label="Ambulance status">
      <div class="flex items-start justify-between gap-3">
        <div class="min-w-0">
          <span id="tk-badge" class="inline-flex items-center rounded-full bg-red-500/10 px-2 py-0.5 text-[10px] font-medium text-red-400 ring-1 ring-inset ring-red-500/20 mb-1 font-mono uppercase tracking-wider">Ambulance On The Way</span>
          <p id="tk-name" class="truncate font-semibold text-white text-base"></p>
          <p id="tk-area" class="text-xs text-slate-400 truncate"></p>
        </div>
        <div class="text-right shrink-0 bg-slate-950/60 p-2 rounded-lg border border-slate-800 min-w-[96px]">
          <p class="text-[10px] uppercase font-bold tracking-wider text-slate-500 leading-none mb-1">Arrives in</p>
          <p id="tk-clock" class="font-display text-4xl font-bold leading-none tabular-nums text-red-500">00:00</p>
        </div>
      </div>

      <div class="mt-3">
        <div class="flex justify-between text-[10px] font-mono text-slate-500 uppercase tracking-wider mb-1">
          <span>Ambulance Progress</span>
          <span id="tk-percent">0%</span>
        </div>
        <div class="h-2 overflow-hidden rounded-full bg-slate-950 p-[2px] border border-slate-800">
          <div id="tk-bar" class="h-full w-0 rounded-full bg-gradient-to-r from-red-600 to-amber-500 shadow-[0_0_8px_rgba(239,68,68,0.5)] transition-[width] duration-1000 ease-linear"></div>
        </div>
      </div>

      <div class="relative mt-3">
        <div class="absolute inset-0 top-2 flex items-center px-4" aria-hidden="true">
          <div id="step-line" class="h-[2px] w-full bg-slate-800 transition-all duration-1000"></div>
        </div>
        <ol id="tk-steps" class="relative flex justify-between w-full text-center"></ol>
      </div>

      <div class="mt-3 flex items-center justify-between bg-slate-950/40 rounded-lg p-2 border border-slate-800/60">
        <p id="tk-msg" class="text-xs text-slate-300 font-medium" aria-live="polite"></p>
        <span class="text-[10px] font-mono text-slate-500 bg-slate-950 px-1.5 py-0.5 rounded whitespace-nowrap ml-2">DEMO 10x</span>
      </div>

      <div class="mt-3">
        <button id="tk-btn" class="w-full rounded-md bg-slate-800 hover:bg-red-950/40 border border-slate-700 hover:border-red-800 py-2 text-xs font-semibold text-slate-200 hover:text-red-400 focus:outline-none focus-visible:ring-2 focus-visible:ring-red-500 transition-all uppercase tracking-wider">Cancel Ambulance</button>
      </div>
    </section>
  </aside>

  <!-- RIGHT: MAP -->
  <main class="flex-1 h-full relative" aria-label="Map">
    <div id="map" class="w-full h-full"></div>

    <button id="themeBtn" class="absolute top-3 left-3 z-[1000] rounded-lg bg-slate-900/95 border border-slate-700 px-3 py-2 text-xs font-bold uppercase tracking-wider text-white shadow-xl hover:bg-slate-800 transition cursor-pointer">Dark map</button>

    <div class="absolute bottom-6 left-3 z-[1000] rounded-lg bg-slate-900/95 border border-slate-700 px-3 py-2 text-xs text-slate-200 shadow-xl space-y-1">
      <div class="flex items-center gap-2"><span class="h-3 w-3 rounded bg-red-600 border border-white"></span> Ambulance ready</div>
      <div class="flex items-center gap-2"><span class="h-3 w-3 rounded bg-slate-600 border border-white"></span> No ambulance</div>
    </div>

    <button id="recenterBtn" title="Go to my location" class="absolute bottom-6 right-6 z-[1000] bg-slate-900/95 hover:bg-slate-800 border border-slate-700 text-white p-3.5 rounded-full shadow-2xl backdrop-blur-md transition-all active:scale-95 flex items-center justify-center group cursor-pointer hidden">
      <svg class="w-5 h-5 text-red-500 group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="3"></circle>
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 2v3m0 14v3M2 12h3m14 0h3"></path>
      </svg>
    </button>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const GROUPS = ['A+', 'A-', 'B+', 'B-', 'AB+', 'AB-', 'O+', 'O-'];
  const BASES = ['A', 'B', 'AB', 'O'];
  const HOSPITALS = [
    { id: 1, name: 'Yashoda Super Speciality Hospital', area: 'Kaushambi',          pos: [28.6446, 77.3236], ambulances: 3, blood: { 'A+': 12, 'A-': 2, 'B+': 9,  'B-': 0, 'AB+': 4, 'AB-': 1, 'O+': 15, 'O-': 3 } },
    { id: 2, name: 'Max Super Speciality Hospital',     area: 'Vaishali',           pos: [28.6450, 77.3400], ambulances: 1, blood: { 'A+': 6,  'A-': 0, 'B+': 11, 'B-': 2, 'AB+': 0, 'AB-': 0, 'O+': 8,  'O-': 0 } },
    { id: 3, name: 'MMG District Hospital',             area: 'Nehru Nagar',        pos: [28.6695, 77.4310], ambulances: 2, blood: { 'A+': 3,  'A-': 1, 'B+': 4,  'B-': 1, 'AB+': 2, 'AB-': 0, 'O+': 7,  'O-': 5 } },
    { id: 4, name: 'Santosh Medical Hospital',          area: 'Pratap Vihar',       pos: [28.6870, 77.4650], ambulances: 0, blood: { 'A+': 10, 'A-': 4, 'B+': 5,  'B-': 3, 'AB+': 6, 'AB-': 2, 'O+': 9,  'O-': 2 } },
    { id: 5, name: 'Columbia Asia Hospital',            area: 'Sector 5, Vaishali', pos: [28.6500, 77.3330], ambulances: 2, blood: { 'A+': 0,  'A-': 0, 'B+': 7,  'B-': 0, 'AB+': 1, 'AB-': 0, 'O+': 12, 'O-': 1 } }
  ];

  const STEPS = ['Assigned', 'On the way', 'Almost there', 'Arrived'];
  const MSGS = [
    'Ambulance assigned. The crew is getting ready.',
    'The crew is driving to you.',
    'The crew is close. Keep the door clear.',
    'Ambulance has arrived! Help is here.'
  ];
  const SPEED = 10; // demo speed

  const km = (a, b) => {
    const r = Math.PI / 180, dLa = (b[0] - a[0]) * r, dLo = (b[1] - a[1]) * r;
    const h = Math.sin(dLa / 2) ** 2 + Math.cos(a[0] * r) * Math.cos(b[0] * r) * Math.sin(dLo / 2) ** 2;
    return 12742 * Math.asin(Math.sqrt(h));
  };

  let PATIENT = [28.6692, 77.4538];
  let query = '';
  let active = null;
  let patientMarker = null;
  let accuracyRing = null;
  const markers = new Map();

  // ---------- MAP ----------
  const map = L.map('map', { zoomControl: false, minZoom: 4, maxZoom: 18, fadeAnimation: true }).setView(PATIENT, 13);
  L.control.zoom({ position: 'topright' }).addTo(map);

  const tiles = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors',
    maxZoom: 18
  }).addTo(map);
  const hospitalLayer = L.layerGroup().addTo(map);

  let darkMap = false;
  $('themeBtn').addEventListener('click', () => {
    darkMap = !darkMap;
    tiles.getContainer().classList.toggle('dark-tiles', darkMap);
    map.getContainer().style.background = darkMap ? '#0b0f19' : '#e2e8f0';
    $('themeBtn').textContent = darkMap ? 'Light map' : 'Dark map';
  });

  const userIcon = L.divIcon({
    className: '', iconSize: [32, 32], iconAnchor: [16, 16],
    html: `<div class="relative flex items-center justify-center w-8 h-8">
      <div class="absolute w-8 h-8 bg-blue-500 opacity-30 rounded-full animate-ping"></div>
      <div class="w-4 h-4 bg-blue-600 border-2 border-white rounded-full shadow-[0_0_12px_rgba(59,130,246,0.8)] ring-2 ring-blue-400/40"></div>
    </div>`
  });

  const hospitalIcon = (ready) => L.divIcon({
    className: '', iconSize: [40, 40], iconAnchor: [20, 20],
    html: `<div class="flex h-10 w-10 items-center justify-center rounded-xl border-2 border-white ${ready ? 'bg-red-600' : 'bg-slate-600'} shadow-[0_4px_14px_rgba(0,0,0,0.8)] transition-transform duration-200 hover:scale-110 cursor-pointer">
      <svg class="h-6 w-6 ${ready ? 'text-white' : 'text-slate-200'}" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"><path d="M12 5v14M5 12h14" /></svg>
    </div>`
  });

  const ambulanceIcon = L.divIcon({
    className: '', iconSize: [36, 36], iconAnchor: [18, 18],
    html: '<div class="grid h-9 w-9 place-items-center rounded-full bg-red-600 text-lg shadow-2xl ring-2 ring-white animate-bounce">🚑</div>'
  });

  const flyThenOpen = (latlng, zoom, openFn) => {
    const target = L.latLng(latlng);
    if (map.getZoom() === zoom && map.getCenter().distanceTo(target) < 5) { openFn(); return; }
    map.once('moveend', openFn);
    map.flyTo(target, zoom, { duration: 0.8 });
  };

  // ---------- SEARCH ----------
  const normalize = s => s.trim().toUpperCase().replace(/\s+/g, '').replace(/POSITIVE|POS/g, '+').replace(/NEGATIVE|NEG/g, '-');
  const kindOf = q => !q ? 'empty' : GROUPS.includes(q) ? 'exact' : BASES.includes(q) ? 'base' : 'invalid';
  const groupHit = g => {
    const k = kindOf(query);
    return k === 'exact' ? g === query : k === 'base' ? g.replace(/[+-]/, '') === query : false;
  };
  const hasBlood = h => {
    const k = kindOf(query);
    if (k === 'empty') return true;
    if (k === 'invalid') return false;
    return GROUPS.some(g => groupHit(g) && h.blood[g] > 0);
  };

  function updateSearch(raw) {
    query = normalize(raw);
    $('clearBtn').classList.toggle('hidden', raw.trim().length === 0);

    const hint = $('q-msg'), k = kindOf(query);
    if (k === 'invalid') {
      hint.textContent = 'Please enter a correct blood group: A+, A-, B+, B-, AB+, AB-, O+ or O-.';
      hint.className = 'mt-2 text-xs font-medium text-red-400';
    } else if (k === 'base') {
      hint.textContent = `Showing ${query}+ and ${query}-`;
      hint.className = 'mt-2 text-xs font-medium text-slate-400';
    } else {
      hint.textContent = '';
      hint.className = 'mt-2 hidden text-xs font-medium';
    }

    Array.from($('chips').children).forEach(chip => {
      chip.className = chip.textContent === query
        ? 'px-2 py-1 text-xs font-mono font-bold rounded bg-red-600 text-white border border-red-500 shadow-md cursor-pointer transition-all'
        : 'px-2 py-1 text-xs font-mono rounded bg-slate-900 hover:bg-slate-800 text-slate-400 hover:text-slate-200 border border-slate-800 cursor-pointer transition-all';
    });
    render();
  }

  GROUPS.forEach(g => {
    const b = document.createElement('button');
    b.textContent = g;
    b.addEventListener('click', () => {
      const next = query === g ? '' : g;
      $('q').value = next;
      updateSearch(next);
    });
    $('chips').appendChild(b);
  });
  $('q').addEventListener('input', e => updateSearch(e.target.value));
  $('clearBtn').addEventListener('click', () => { $('q').value = ''; updateSearch(''); $('q').focus(); });

  // ---------- RENDER ----------
  function updateHospitalsData() {
    HOSPITALS.forEach(h => { h.km = km(h.pos, PATIENT); h.eta = Math.max(3, Math.round(h.km * 2.2)); });
  }

  const bloodGrid = h => GROUPS.map(g => {
    const u = h.blood[g], hit = groupHit(g) && u > 0;
    const cls = hit ? 'border-red-500 bg-red-600 text-white ring-2 ring-red-400'
      : u > 3 ? 'border-slate-700 bg-slate-800/60 text-slate-200'
      : u > 0 ? 'border-amber-500/50 bg-amber-500/10 text-amber-300'
      : 'border-slate-800 bg-slate-900 text-slate-600 line-through';
    return `<div class="flex flex-col items-center justify-center rounded border p-1 text-center ${cls}">
      <span class="text-[11px] font-bold tracking-wider">${g}</span>
      <span class="text-[10px] opacity-80">${u > 0 ? u + ' unit' + (u > 1 ? 's' : '') : 'Out'}</span>
    </div>`;
  }).join('');

  const sendButton = (h, inPopup) => {
    const busy = !!active, ok = h.ambulances > 0 && !busy;
    const label = busy ? 'Ambulance already sent' : h.ambulances ? 'Send Ambulance' : 'No ambulance available';
    const click = inPopup && ok ? `onclick="window.BloodBridgeEngine.dispatch(${h.id})"` : '';
    return `<button data-dispatch="${h.id}" ${click} ${ok ? '' : 'disabled'} class="mt-3 w-full rounded-lg bg-red-600 py-2 text-sm font-bold text-white hover:bg-red-500 focus:outline-none focus-visible:ring-2 focus-visible:ring-red-300 disabled:cursor-not-allowed disabled:bg-slate-800 disabled:text-slate-500 transition">${label}</button>`;
  };

  const ambPill = h => `<span class="shrink-0 rounded-full px-2.5 py-0.5 text-xs font-medium ${h.ambulances ? 'bg-emerald-500/15 text-emerald-300' : 'bg-slate-800 text-slate-400'}">
    ${h.ambulances ? h.ambulances + (h.ambulances > 1 ? ' ambulances' : ' ambulance') : 'No ambulance'}</span>`;

  const popupMarkup = h => `<div class="p-1 font-sans text-slate-200">
    <h4 class="font-display font-bold text-base text-white tracking-wide leading-tight">${h.name}</h4>
    <p class="text-xs text-slate-400 mt-0.5 mb-2">${h.area}</p>
    <div class="grid grid-cols-2 gap-2 my-2 border-t border-b border-slate-800 py-2">
      <div class="bg-slate-900/80 p-1.5 rounded border border-slate-800 text-center">
        <span class="text-[10px] text-slate-500 uppercase font-mono block">Distance</span>
        <strong class="text-sm font-semibold text-white font-mono">${h.km.toFixed(1)} km</strong>
      </div>
      <div class="bg-slate-900/80 p-1.5 rounded border border-slate-800 text-center">
        <span class="text-[10px] text-slate-500 uppercase font-mono block">Ambulance in</span>
        <strong class="text-sm font-semibold text-white font-mono">~${h.eta} min</strong>
      </div>
    </div>
    <span class="text-[10px] text-slate-500 uppercase font-bold tracking-wider font-mono block mb-1">Blood available</span>
    <div class="grid grid-cols-4 gap-1">${bloodGrid(h)}</div>
    ${sendButton(h, true)}
  </div>`;

  function render() {
    const rows = HOSPITALS.filter(hasBlood).sort((a, b) => a.km - b.km);

    $('list').innerHTML = rows.length ? rows.map(h => `
      <article data-id="${h.id}" class="cursor-pointer rounded-xl border border-slate-800 bg-slate-900/80 p-4 shadow-lg hover:border-slate-700 transition">
        <div class="flex items-start justify-between gap-3">
          <div class="min-w-0">
            <h2 class="font-semibold text-white">${h.name}</h2>
            <p class="text-xs text-slate-400">${h.area} &middot; ${h.km.toFixed(1)} km &middot; about ${h.eta} min</p>
          </div>
          ${ambPill(h)}
        </div>
        <div class="mt-3 grid grid-cols-4 gap-1.5">${bloodGrid(h)}</div>
        ${sendButton(h, false)}
      </article>`).join('')
      : `<div class="text-center py-8 px-4 rounded-xl border border-dashed border-slate-800 bg-slate-900/10">
          <h3 class="text-sm font-semibold text-slate-300">${kindOf(query) === 'invalid' ? 'Enter a correct blood group' : 'No hospitals found'}</h3>
          <p class="mt-1 text-xs text-slate-500">${kindOf(query) === 'invalid' ? 'Use A+, A-, B+, B-, AB+, AB-, O+ or O-.' : 'No hospital has this blood right now. Try a compatible group.'}</p>
        </div>`;

    hospitalLayer.clearLayers();
    markers.clear();
    rows.forEach(h => {
      const m = L.marker(h.pos, { icon: hospitalIcon(h.ambulances > 0) }).bindPopup(popupMarkup(h), { minWidth: 260 });
      m.addTo(hospitalLayer);
      markers.set(h.id, m);
    });
  }

  $('list').addEventListener('click', e => {
    const btn = e.target.closest('[data-dispatch]');
    if (btn) { if (!btn.disabled) dispatch(Number(btn.dataset.dispatch)); return; }
    const card = e.target.closest('[data-id]');
    if (!card) return;
    const h = HOSPITALS.find(x => x.id === Number(card.dataset.id));
    if (h) flyThenOpen(h.pos, 15, () => { const m = markers.get(h.id); if (m) m.openPopup(); });
  });

  // ---------- AMBULANCE TRACKER ----------
  $('tk-steps').innerHTML = STEPS.map((s, i) => `
    <li class="flex flex-col items-center flex-1 relative">
      <div id="st-${i}" class="w-4 h-4 rounded-full border-2 border-slate-800 bg-slate-950 flex items-center justify-center text-[9px] font-bold text-slate-500 z-10 transition-all duration-500">${i + 1}</div>
      <span id="sl-${i}" class="text-[10px] font-semibold tracking-tight text-slate-500 mt-1 block transition-all duration-500">${s}</span>
    </li>`).join('');

  const BADGE_BASE = 'inline-flex items-center rounded-full px-2 py-0.5 text-[10px] font-medium ring-1 ring-inset mb-1 font-mono uppercase tracking-wider ';
  const CLOCK_BASE = 'font-display text-4xl font-bold leading-none tabular-nums ';
  const fmt = s => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;

  function paint() {
    const a = active, p = 1 - a.remaining / a.total, pct = Math.round(p * 100);
    const stage = p >= 1 ? 3 : p >= 0.8 ? 2 : p >= 0.08 ? 1 : 0;

    $('tk-clock').textContent = fmt(a.remaining);
    $('tk-bar').style.width = pct + '%';
    $('tk-percent').textContent = pct + '%';
    $('tk-msg').textContent = MSGS[stage];
    $('step-line').style.background = `linear-gradient(to right, #ef4444 ${pct}%, #1e293b ${pct}%)`;

    STEPS.forEach((_, i) => {
      const on = i <= stage;
      $('st-' + i).className = on
        ? 'w-4 h-4 rounded-full border-2 border-red-500 bg-red-600 text-white flex items-center justify-center text-[9px] font-bold z-10 shadow-[0_0_8px_rgba(239,68,68,0.6)] scale-110 transition-all duration-500'
        : 'w-4 h-4 rounded-full border-2 border-slate-800 bg-slate-950 flex items-center justify-center text-[9px] font-bold text-slate-500 z-10 transition-all duration-500';
      $('sl-' + i).className = on
        ? 'text-[10px] font-bold tracking-tight text-white mt-1 block transition-all duration-500'
        : 'text-[10px] font-semibold tracking-tight text-slate-500 mt-1 block transition-all duration-500';
    });

    a.marker.setLatLng([a.h.pos[0] + (PATIENT[0] - a.h.pos[0]) * p, a.h.pos[1] + (PATIENT[1] - a.h.pos[1]) * p]);

    if (a.remaining === 0 && !a.done) {
      a.done = true;
      clearInterval(a.timer);
      $('tk-badge').textContent = 'Ambulance Arrived';
      $('tk-badge').className = BADGE_BASE + 'bg-emerald-500/10 text-emerald-400 ring-emerald-500/30';
      $('tk-clock').textContent = 'Here!';
      $('tk-clock').className = CLOCK_BASE + 'text-emerald-400';
      $('tk-bar').style.background = '#10b981';
      $('tk-btn').textContent = 'Done';
      const el = a.marker.getElement();
      if (el && el.firstElementChild) el.firstElementChild.classList.remove('animate-bounce');
    }
  }

  function dispatch(id) {
    if (active) return;
    const h = HOSPITALS.find(x => x.id === id);
    if (!h || h.ambulances <= 0) return;
    h.ambulances--;

    const total = h.eta * 60;
    active = {
      h, total, remaining: total, done: false,
      marker: L.marker(h.pos, { icon: ambulanceIcon, zIndexOffset: 1000 }).addTo(map),
      route: L.polyline([h.pos, PATIENT], { color: '#ef4444', weight: 4, dashArray: '6 8', opacity: 0.9 }).addTo(map)
    };

    $('tk-name').textContent = h.name;
    $('tk-area').textContent = h.area;
    $('tk-badge').textContent = 'Ambulance On The Way';
    $('tk-badge').className = BADGE_BASE + 'bg-red-500/10 text-red-400 ring-red-500/20';
    $('tk-clock').className = CLOCK_BASE + 'text-red-500';
    $('tk-bar').style.background = '';
    $('tk-bar').style.width = '0%';
    $('tk-btn').textContent = 'Cancel Ambulance';
    $('tracker').classList.remove('hidden');
    map.invalidateSize();
    map.fitBounds(L.latLngBounds([h.pos, PATIENT]), { padding: [60, 60] });

    paint();
    active.timer = setInterval(() => { active.remaining = Math.max(0, active.remaining - SPEED); paint(); }, 1000);
    render();
  }

  function closeTracker() {
    if (!active) return;
    clearInterval(active.timer);
    map.removeLayer(active.marker);
    map.removeLayer(active.route);
    if (!active.done) active.h.ambulances++;
    active = null;
    $('tracker').classList.add('hidden');
    map.invalidateSize();
    render();
  }

  $('tk-btn').addEventListener('click', closeTracker);
  window.BloodBridgeEngine = { dispatch, cancel: closeTracker };

  // ---------- LOCATION ----------
  const status = $('location-status');
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      pos => {
        PATIENT = [pos.coords.latitude, pos.coords.longitude];
        if (patientMarker) map.removeLayer(patientMarker);
        if (accuracyRing) map.removeLayer(accuracyRing);
        accuracyRing = L.circle(PATIENT, {
          radius: pos.coords.accuracy || 100, color: '#3b82f6', weight: 1,
          fillColor: '#3b82f6', fillOpacity: 0.05, interactive: false
        }).addTo(map);
        patientMarker = L.marker(PATIENT, { icon: userIcon, keyboard: false })
          .addTo(map).bindPopup('You are here', { autoPan: false });
        map.setView(PATIENT, 14, { animate: true });
        status.textContent = 'Found you! Showing the nearest hospitals.';
        status.className = 'text-xs font-semibold text-emerald-400';
        $('status-pulse').className = 'animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75';
        $('status-dot').className = 'relative inline-flex rounded-full h-2 w-2 bg-emerald-500';
        $('recenterBtn').classList.remove('hidden');
        updateHospitalsData();
        render();
      },
      err => {
        status.textContent = err.code === err.PERMISSION_DENIED
          ? 'Location is off. Showing Ghaziabad hospitals.'
          : "Can't find you. Showing Ghaziabad hospitals.";
        status.className = 'text-xs font-medium text-amber-500';
        $('status-pulse').classList.add('hidden');
        updateHospitalsData();
        render();
      },
      { enableHighAccuracy: true, timeout: 8000 }
    );
  } else {
    status.textContent = 'Location not working. Showing Ghaziabad hospitals.';
    status.className = 'text-xs font-medium text-red-400';
  }

  $('recenterBtn').addEventListener('click', () => {
    flyThenOpen(PATIENT, 15, () => { if (patientMarker) patientMarker.openPopup(); });
  });

  updateHospitalsData();
  updateSearch('');
})();
</script>
</body>
</html>
